name: HyperScreen CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: C++20 Core Protocol & FEC Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -S core -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build Core Tests
        run: cmake --build build --config Release -j4

      - name: Run Core Tests (CRC-16, 0ms FEC, RingBuffer, 1-Euro)
        run: ctest --test-dir build --output-on-failure
