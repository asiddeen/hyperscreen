<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon -->
    <radialGradient id="iconBgLight" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <linearGradient id="iconBorderLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0.2" />
    </linearGradient>

    <!-- Wordmark Gradients for Light Theme -->
    <linearGradient id="hyperGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <linearGradient id="screenGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="badgeGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.08" />
    </linearGradient>

    <!-- Neon Gradients -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="violetNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <filter id="logoGlowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dropShadowLight" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- ==================== LOGOMARK ICON ==================== -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="180" height="180" rx="42" fill="url(#iconBgLight)" filter="url(#dropShadowLight)" />
    <rect x="0" y="0" width="180" height="180" rx="42" fill="none" stroke="url(#iconBorderLight)" stroke-width="2" />

    <!-- Left Screen (Mac) -->
    <rect x="24" y="44" width="60" height="92" rx="7" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
    <rect x="26" y="46" width="56" height="88" rx="6" fill="#0F172A" />
    <circle cx="34" cy="53" r="1.5" fill="#EF4444" opacity="0.8" />
    <circle cx="39" cy="53" r="1.5" fill="#F59E0B" opacity="0.8" />
    <circle cx="44" cy="53" r="1.5" fill="#10B981" opacity="0.8" />

    <!-- Right Screen (Android) -->
    <rect x="96" y="44" width="60" height="92" rx="7" fill="#241B35" stroke="#581C87" stroke-width="1.5" />
    <rect x="98" y="46" width="56" height="88" rx="6" fill="#140D26" />
    <circle cx="147" cy="53" r="1.5" fill="#A855F7" opacity="0.7" />

    <!-- Hyper 'H' Stems -->
    <path d="M60 56 L60 124" stroke="url(#cyanNeon)" stroke-width="7" stroke-linecap="round" filter="url(#logoGlowLight)" />
    <path d="M60 60 L60 120" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

    <path d="M120 56 L120 124" stroke="url(#violetNeon)" stroke-width="7" stroke-linecap="round" filter="url(#logoGlowLight)" />
    <path d="M120 60 L120 120" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

    <!-- Cross Beam Bridge -->
    <path d="M57 90 L123 90" stroke="url(#beamGrad)" stroke-width="6" stroke-linecap="round" filter="url(#logoGlowLight)" />
    <path d="M60 90 L120 90" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

    <!-- Center Pulse Core -->
    <circle cx="90" cy="90" r="5" fill="#00F2FE" filter="url(#logoGlowLight)" />
    <circle cx="90" cy="90" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- ==================== TYPOGRAPHY & WORDMARK ==================== -->
  <g transform="translate(230, 40)">
    <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" font-size="78" font-weight="900" letter-spacing="-1.5">
      <tspan fill="url(#hyperGradLight)">Hyper</tspan>
      <tspan fill="url(#screenGradLight)">Screen</tspan>
    </text>

    <!-- Subtitle Pill -->
    <g transform="translate(2, 106)">
      <rect x="0" y="0" width="310" height="30" rx="15" fill="url(#badgeGradLight)" stroke="#0284C7" stroke-width="1.2" stroke-opacity="0.4" />
      <circle cx="16" cy="15" r="4" fill="#0284C7" />
      <text x="28" y="19.5" fill="#0284C7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2">
        SUB-8MS SECOND DISPLAY ENGINE
      </text>
    </g>

    <!-- Feature Tags -->
    <g transform="translate(324, 106)">
      <rect x="0" y="0" width="95" height="30" rx="15" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.2" stroke-opacity="0.3" />
      <text x="47.5" y="19" fill="#4F46E5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.8">
        120Hz HiDPI
      </text>
    </g>

    <g transform="translate(429, 106)">
      <rect x="0" y="0" width="138" height="30" rx="15" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.2" stroke-opacity="0.3" />
      <text x="69" y="19" fill="#0369A1" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.8">
        ZERO-ADB USB-C
      </text>
    </g>

    <g transform="translate(577, 106)">
      <rect x="0" y="0" width="96" height="30" rx="15" fill="#FAF5FF" stroke="#9333EA" stroke-width="1.2" stroke-opacity="0.3" />
      <text x="48" y="19" fill="#7E22CE" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.8">
        5GHz P2P
      </text>
    </g>
  </g>
</svg>
